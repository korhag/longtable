[package]
name = "battle-map"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "multipart"] }
base64 = "0.23.1"
futures-util = "0.3.34"
rand = "0.10.3"
rapier3d = "0.36.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["fs", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
